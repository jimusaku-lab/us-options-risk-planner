name: Deploy US options risk planner

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm run test

      - name: Build
        run: GITHUB_PAGES=true VITE_DISABLE_EXTERNAL_QUOTES=true npm run build

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/us-options-risk-planner-pages
          mkdir -p /tmp/us-options-risk-planner-pages
          cp -R dist/. /tmp/us-options-risk-planner-pages/
          touch /tmp/us-options-risk-planner-pages/.nojekyll
          git fetch origin gh-pages || true
          git switch --orphan gh-pages-work
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/us-options-risk-planner-pages/. .
          git add .
          git commit -m "Deploy static site"
          git push --force origin HEAD:gh-pages
